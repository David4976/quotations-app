<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gestionnaire de citations</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>Mes citations</h1>
        <h3>Nombre de citations : <span id="count">1</span></h3>
      </div>
      <hr />

      <div class="grid">
        <div class="card">
          <form id="quoteForm">
            <div>
              <label for="quoteInput">Citation :</label>
              <input
                type="text"
                id="quoteInput"
                name="quote"
                placeholder="Ex : On ne naît pas femme, on le devient."
              />
            </div>
            <div>
              <label for="authorInput">Auteur / Autrice :</label>
              <input
                type="text"
                id="authorInput"
                name="author"
                placeholder="Simone de Beauvoir"
              />
            </div>
            <button type="submit">Ajouter la citation</button>
          </form>
        </div>

        <div class="quote-list-wrap">
          <div id="quote-list">
            <div class="quote">
              <p class="text">"On ne naît pas femme, on le devient."</p>
              <p class="author">Simone de Beauvoir</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
