<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotations-App</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mes citations</h1>
    <h2>Gestionnaire de citations en ligne</h2>
    <h3>0 citations</h3>
    <hr />
    <form id="quoteForm">
      <div>
        <label for="quoteInput">Citation :</label>
        <input type="text" id="quoteInput" name="quote" />
      </div>

      <div>
        <label for="authorInput">Auteur / Autrice :</label>
        <input type="text" id="authorInput" name="author" />
      </div>

      <button type="submit">Ajouter la citation</button>
    </form>
    <div id="quote-list">
      <div class="quote">
        <p class="text">"On ne naît pas femme, on le devient."</p>
        <p class="author">Simone de Beauvoir</p>
      </div>
    </div>
  </body>
</html>
